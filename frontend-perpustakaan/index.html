<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Perpustakaan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">

    <!-- Header Biru "Perpustakaan" & Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Perpustakaan</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Buku</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="#">Kategori</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Area Konten Utama -->
    <div class="container my-4">
        
        <!-- Teks Status Memuat -->
        <div id="loading-status" class="alert alert-info text-center py-3 mb-4" role="alert">
            Memuat aplikasi...
        </div>

        <h3 class="mb-3 text-secondary">CRUD Kategori Buku</h3>

        <!-- Form Input -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="category-form">
                    <input type="hidden" id="category-id">
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Kategori</label>
                        <input type="text" class="form-control" id="nama" required>
                    </div>
                    <div class="mb-3">
                        <label for="deskripsi" class="form-label">Deskripsi</label>
                        <textarea class="form-control" id="deskripsi" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </form>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-bordered table-striped align-middle mb-0">
                    <thead class="table-dark text-center">
                        <tr>
                            <th style="width: 10%;">No</th>
                            <th style="width: 30%;">Nama Kategori</th>
                            <th style="width: 40%;">Deskripsi</th>
                            <th style="width: 20%;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="category-table-body">
                        <!-- Data dimuat via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script JS -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
